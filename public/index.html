<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibe Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand"><h1>Vibe Money</h1><span>AI visibility for local businesses</span></div>
    <nav class="views" aria-label="Views">
      <button type="button" data-view="business" aria-current="page">Businesses</button>
      <button type="button" data-view="program">Program outcomes</button>
    </nav>
    <span class="pill" id="mode"></span>
  </div>
</header>

<main class="wrap" id="view-business">
  <div class="layout">
    <aside class="side">
      <div class="tag">Pilot businesses</div>
      <ul class="biz-list" id="bizList"></ul>
      <button type="button" class="btn ghost small" id="showOnboard">Add a business</button>
      <form id="onboard" class="card form" hidden>
        <label>Name<input name="name" required></label>
        <label>Category<input name="category" placeholder="café, gym, salon…" required></label>
        <label>Sector<select name="sector"><option>food &amp; beverage</option><option>fitness</option><option>beauty</option><option>other</option></select></label>
        <label>District<input name="district" placeholder="Al Reem Island"></label>
        <label>City<input name="city" value="Abu Dhabi" required></label>
        <label>Opening hours<input name="hours" placeholder="Mo-Su 09:00-21:00"></label>
        <label>Competitors<input name="competitors" placeholder="Comma-separated"></label>
        <label>Reviews on Google<input name="reviews" type="number" min="0" value="0"></label>
        <button class="btn" type="submit">Onboard</button>
      </form>
    </aside>

    <section class="content" id="biz" aria-live="polite">
      <p class="empty">Loading…</p>
    </section>
  </div>
</main>

<main class="wrap" id="view-program" hidden></main>

<footer class="wrap foot">Pilot businesses, figures and competitors are fictional. Simulated assistants are labelled; set ANTHROPIC_API_KEY to add real Claude answers.</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
